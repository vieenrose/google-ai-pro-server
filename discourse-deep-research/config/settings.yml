# Plugin settings for Sloth AI (Google AI Pro / Antigravity bridge).
# Keys kept from discourse-gemini for migration continuity.

discourse_gemini:
  gemini_enabled:
    default: true
    client: true

  gemini_bridge_url:
    default: "http://127.0.0.1:8787"
    description: "Base URL of the local Sloth AI bridge (bridge/server.py)."

  gemini_bridge_token:
    default: ""
    secret: true
    description: "Bearer token the bridge expects (BRIDGE_TOKEN). Leave empty if the bridge runs without auth."

  gemini_model:
    default: "gemini-3.7-flash-tiered"
    description: "Default Google AI Pro model used by the bridge."
